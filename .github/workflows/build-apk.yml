name: 🚀 Build A.K Journal Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: 📱 Build A.K Journal APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Get A.K Journal
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 📦 Extract A.K Journal Pro 2.0
        run: |
          unzip -o AK_Journal_Pro_2.0.zip -d build-project

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: 🔨 Build A.K Journal
        working-directory: build-project
        run: |
          gradle assembleDebug --no-daemon

      - name: 📱 Rename APK
        run: |
          mkdir -p release
          cp build-project/app/build/outputs/apk/debug/app-debug.apk \
             release/A.K-Journal.apk

      - name: 📤 Upload A.K Journal APK
        uses: actions/upload-artifact@v4
        with:
          name: A.K-Journal-APK
          path: release/A.K-Journal.apk
          retention-days: 30
